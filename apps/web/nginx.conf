# Configuração de SPA do Fio (produção, servido na 8080).
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Container-local healthcheck endpoint.
  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Same-origin API access. O SPA chama /api/v1/* e o serviço recebe /v1/*.
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Fallback de roteamento no cliente (react-router).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
